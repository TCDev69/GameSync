name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Parse version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build release notes from CHANGELOG
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $version = $env:VERSION
          $lines = Get-Content -Path CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+\[?$([regex]::Escape($version))\]?(\s|$)") { $start = $i; break }
          }

          if ($start -lt 0) {
            throw "CHANGELOG.md has no '## [$version]' section. Add the entry before tagging $env:TAG."
          }

          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') { break }
            if ($lines[$i] -match '^\[[^\]]+\]:\s') { continue }
            $body.Add($lines[$i])
          }

          $notes = ($body -join "`n").Trim()
          if (-not $notes) { throw "CHANGELOG.md section for $version is empty." }

          Set-Content -Path release-notes.md -Value "## What's changed in $version`n`n$notes" -Encoding utf8
          Write-Host "Release notes:`n$notes"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after chocolatey install" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Publish and build installer
        shell: pwsh
        run: |
          dotnet test GameSync.sln -c Release -p:Platform=x64
          .\installer\build-release.ps1 -Version "${{ steps.ver.outputs.version }}" -InnoCompiler $env:ISCC

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          name: GameSync ${{ steps.ver.outputs.version }}
          files: |
            artifacts/GameSync-Setup-x64.exe
          body_path: release-notes.md
          generate_release_notes: true
