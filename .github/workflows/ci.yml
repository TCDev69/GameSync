name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore GameSync.sln

      - name: Build Debug
        run: dotnet build GameSync.sln -c Debug -p:Platform=x64 --no-restore

      - name: Build Release
        run: dotnet build GameSync.sln -c Release -p:Platform=x64 --no-restore

      - name: Test Release
        run: dotnet test GameSync.sln -c Release -p:Platform=x64 --no-build --verbosity normal
